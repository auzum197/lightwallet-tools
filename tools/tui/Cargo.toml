[package]
name = "lightwallet-tui"
description = "lwtui: a live terminal monitor for Zcash lightwallet indexers"
version.workspace = true
repository.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "lwtui"
path = "src/main.rs"

[dependencies]
lightwallet-core = { path = "../../crates/core", features = ["canonical", "crosslink"] }
lightwallet-txview = { path = "../txview" }
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
hex.workspace = true
futures-util.workspace = true
ratatui.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tonic = { workspace = true, features = ["tls-ring", "tls-webpki-roots"] }

# Shipped as a prebuilt binary by `dist` (the workspace is publish = false,
# which would otherwise exclude it).
[package.metadata.dist]
dist = true
