[package]
name = "lightwallet-cli"
description = "lwcli: one-shot gRPC client for Zcash lightwallet indexers"
readme = "README.md"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "lwcli"
path = "src/main.rs"

[features]
default = ["tor", "nym"]
tor = ["dep:lightwallet-transport-tor", "dep:arti-client"]
nym = ["dep:lightwallet-transport-nym"]

[dependencies]
lightwallet-core = { path = "../../crates/core", features = [
    "canonical",
    "crosslink",
] }
lightwallet-proto-canonical = { path = "../../crates/canonical" }
lightwallet-proto-crosslink = { path = "../../crates/crosslink" }
lightwallet-transport-tor = { path = "../../crates/transport-tor", optional = true }
lightwallet-transport-nym = { path = "../../crates/transport-nym", optional = true }
lightwallet-txview = { path = "../txview" }
anyhow.workspace = true
arti-client = { workspace = true, optional = true }
clap.workspace = true
clap_complete.workspace = true
futures-util.workspace = true
hex.workspace = true
prost.workspace = true
prost-reflect.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tonic = { workspace = true, features = ["tls-ring", "tls-webpki-roots"] }

[dev-dependencies]
lightwallet-test-support = { path = "../../crates/test-support" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }

# Not shipped prebuilt yet: lwcli advances on its own schedule.
[package.metadata.dist]
dist = false
