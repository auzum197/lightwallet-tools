[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("crosslink"))'] }

[profile.release]
overflow-checks = true

# The Crosslink staking surface (TxVersion::VCrosslink, StakingAction) lives in
# the auzum-zcash fork, behind zcash_unstable = "crosslink". The fork's
# zcash_transparent pulls the published zcash_protocol transitively, so the
# patch is mandatory: a path/git dep alone does not propagate through it.
[patch.crates-io]
zcash_protocol = { path = "/Users/dorian/projects/zcash/auzum/auzum-zcash/components/zcash_protocol" }

[workspace.dependencies]
prost = "0.14"
tonic = "0.14"
futures-util = "0.3"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
protox = "0.9"
tokio = "1"
tower = { version = "0.5", features = ["util"] }
hyper-util = "0.1"
arti-client = { version = "0.44", features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
prost-reflect = "0.16"
axum = "0.8"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
zcash_primitives = { path = "/Users/dorian/projects/zcash/auzum/auzum-zcash/zcash_primitives" }
orchard = "0.15"
zcash_protocol = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
