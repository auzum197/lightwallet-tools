[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/auzum197/lightwallet-tools"

[workspace.lints.rust]
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("crosslink"))'] }

[profile.release]
overflow-checks = true

# The profile `dist` ships binaries with: release plus whole-program LTO and a
# single codegen unit for speed and size, symbols stripped. Overflow checks stay
# on (a wrong number is worse than a slow one) and panics keep unwinding so the
# TUI can restore the terminal on the way out. No target-cpu: the binaries run
# on any CPU of their architecture.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true

# The Crosslink staking surface (TxVersion::VCrosslink, StakingAction) lives in
# the auzum-zcash fork, behind zcash_unstable = "crosslink". The fork's
# zcash_transparent pulls the published zcash_protocol transitively, so the
# patch is mandatory: a path/git dep alone does not propagate through it.
[patch.crates-io]
zcash_protocol = { git = "https://github.com/auzum197/auzum-zcash", rev = "f4f1f53af0958a21a6163a118652b4a23b7215fb" }

[workspace.dependencies]
prost = "0.14"
tonic = "0.14"
futures-util = "0.3"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
protox = "0.9"
tokio = "1"
tower = { version = "0.5", features = ["util"] }
hyper-util = "0.1"
arti-client = { version = "0.44", features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
prost-reflect = "0.16"
axum = "0.8"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
zcash_primitives = { git = "https://github.com/auzum197/auzum-zcash", rev = "f4f1f53af0958a21a6163a118652b4a23b7215fb" }
orchard = "0.15"
zcash_protocol = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
