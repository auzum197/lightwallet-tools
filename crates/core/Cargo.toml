[package]
name = "lightwallet-core"
description = "Variant- and transport-generic client layer for Zcash lightwalletd-style indexers"
readme = "README.md"
keywords = ["zcash", "lightwalletd", "grpc", "tonic", "wallet"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
tonic.workspace = true
futures-util.workspace = true
trait-variant = "0.1"
lightwallet-proto-canonical = { path = "../canonical", version = "0.0.1", optional = true }
lightwallet-proto-crosslink = { path = "../crosslink", version = "0.0.1", optional = true }

[dev-dependencies]
lightwallet-test-support = { path = "../test-support" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tonic = { workspace = true, features = ["tls-ring", "tls-webpki-roots"] }

[features]
default = ["canonical", "tls"]
canonical = ["dep:lightwallet-proto-canonical"]
crosslink = ["dep:lightwallet-proto-crosslink"]
tls = ["tonic/tls-ring", "tonic/tls-webpki-roots"]
